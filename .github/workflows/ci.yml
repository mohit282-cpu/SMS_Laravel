name: CI Pipeline

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel-tests:
    name: PHP Tests & Linting
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: mysql_test
      DB_TEST_DATABASE: sms_laravel_test
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: root
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_DATABASE: sms_laravel_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sms_laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, pdo_mysql, mysqli, sqlite, pdo_sqlite, gmp, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Setup Application Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=sms_laravel/DB_DATABASE=sms_laravel_test/g' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=root/g' .env

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Verify Isolated Test Environment
        run: |
          if [ "$DB_DATABASE" = "sms_laravel" ] || [ "$DB_TEST_DATABASE" = "sms_laravel" ]; then
            echo "::error::CI test environment is targeting production database name 'sms_laravel'! Aborting."
            exit 1
          fi
          echo "Test environment database isolation verified ($DB_TEST_DATABASE)."

      - name: Composer Security Audit Gate
        run: php .github/scripts/audit-checker.php

      - name: PHP Syntax Linting
        run: |
          errors=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "Syntax error in $file"
              php -l "$file"
              errors=$((errors + 1))
            fi
          done < <(find app bootstrap config database routes tests -type f -name "*.php" -print0)
          if [ $errors -ne 0 ]; then
            echo "$errors PHP syntax errors found!"
            exit 1
          fi
          echo "All PHP files passed syntax linting."

      - name: Verify MySQL Connection
        run: |
          php -r "
            \$retries = 15;
            while (\$retries > 0) {
              try {
                new PDO('mysql:host=127.0.0.1;port=3306;dbname=sms_laravel_test', 'root', 'root');
                echo 'MySQL service is connected and ready.' . PHP_EOL;
                exit(0);
              } catch (Exception \$e) {
                echo 'Waiting for MySQL... (' . \$e->getMessage() . ')' . PHP_EOL;
                sleep(2);
                \$retries--;
              }
            }
            echo 'Unable to connect to MySQL service container.' . PHP_EOL;
            exit(1);
          "

      - name: Run Migrations on Isolated Test Database
        run: |
          php artisan migrate --force --database=mysql_test
          php artisan db:seed --force --database=mysql_test

      - name: Verify Laravel Configuration & Routes
        run: |
          php artisan config:clear
          php artisan route:list

      - name: Run Test Suite
        run: php artisan test --verbose --log-junit test-results.xml

      - name: Diagnostic Output on Failure
        if: failure()
        run: |
          echo "=== TEST RESULTS SUMMARY ==="
          cat test-results.xml 2>/dev/null || true
          echo "=== LARAVEL LOG ==="
          cat storage/logs/laravel.log 2>/dev/null || true

  frontend-build:
    name: Frontend Asset Compilation
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: NPM Dependency Audit Gate
        run: node .github/scripts/npm-audit-checker.js

      - name: Compile Production Assets
        run: npm run prod

      - name: Verify Compiled Assets
        run: |
          test -f public/js/app.js || { echo "public/js/app.js is missing!"; exit 1; }
          test -f public/css/app.css || { echo "public/css/app.css is missing!"; exit 1; }
          echo "Frontend assets compiled successfully."
