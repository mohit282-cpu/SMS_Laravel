name: CD (Deployment)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: 'Execute database migrations'
        required: true
        type: boolean
        default: true
      enable_maintenance:
        description: 'Enable maintenance mode during deployment'
        required: true
        type: boolean
        default: true

concurrency:
  group: cd-${{ inputs.target_env || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-validation:
    name: Pre-deployment Gate & Artifact Assembly
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, gd, zip, pdo_mysql, mysqli, gmp
          coverage: none
          tools: composer:v2

      - name: Install Production Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node.js 14 for Legacy Build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '14'
          cache: npm

      - name: Build Production Assets
        run: |
          npm ci
          npm run prod

      - name: Verify Asset Integrity
        run: |
          set -euo pipefail
          test -f public/js/app.js || { echo "::error::public/js/app.js missing"; exit 1; }
          test -f public/css/app.css || { echo "::error::public/css/app.css missing"; exit 1; }
          test -f public/mix-manifest.json || { echo "::error::public/mix-manifest.json missing"; exit 1; }

      - name: Package Release Archive (Explicit Allowlist Manifest)
        run: |
          set -euo pipefail
          mkdir -p release-dist
          TAR_FILE="release-dist/release-${{ github.sha }}.tar.gz"

          # Use explicit allowlist of application trees required in production
          tar -czf "${TAR_FILE}" \
            app \
            bootstrap \
            config \
            database/migrations \
            database/seeders \
            public \
            resources/views \
            resources/lang \
            routes \
            vendor \
            artisan \
            composer.json \
            composer.lock

          # Generate cryptographic SHA-256 checksum
          cd release-dist
          sha256sum "release-${{ github.sha }}.tar.gz" > "release-${{ github.sha }}.tar.gz.sha256"
          cat "release-${{ github.sha }}.tar.gz.sha256"
          cd ..

      - name: Upload Release Artifact and Checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            release-dist/release-${{ github.sha }}.tar.gz
            release-dist/release-${{ github.sha }}.tar.gz.sha256
          retention-days: 7

  deploy:
    name: Deploy to ${{ inputs.target_env || 'staging' }}
    needs: pre-deploy-validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target_env || 'staging' }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Download Release Artifact and Checksum
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-bundle
          path: deploy-dist

      - name: Verify Artifact Checksum
        run: |
          set -euo pipefail
          cd deploy-dist
          sha256sum -c "release-${{ github.sha }}.tar.gz.sha256"
          echo "Release archive cryptographic checksum verified successfully."

      - name: Validate Host Credentials and Target Environment
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "::error::DEPLOY_HOST and DEPLOY_USER secrets must be configured in GitHub Environment '${{ inputs.target_env || 'staging' }}'."
            exit 1
          fi
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "::error::APP_URL environment variable is mandatory for health verification."
            exit 1
          fi

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Execute Atomic Release on Target Host with Recovery Trap
        env:
          TARGET_DIR: ${{ vars.DEPLOY_PATH || '/var/www/sms_academy' }}
          MAINTENANCE: ${{ inputs.enable_maintenance }}
          MIGRATIONS: ${{ inputs.run_migrations }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Transferring release ${SHA} to ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}..."

          # Transfer release archive and checksum to host /tmp
          scp deploy-dist/release-${SHA}.tar.gz deploy-dist/release-${SHA}.tar.gz.sha256 \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/

          # Execute remote deployment script with automated failure trap and rollback
          ssh -T ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<'REMOTE_SCRIPT'
            set -euo pipefail

            TARGET_DIR="${TARGET_DIR:-/var/www/sms_academy}"
            MAINTENANCE="${MAINTENANCE:-true}"
            MIGRATIONS="${MIGRATIONS:-true}"
            SHA="${SHA}"
            RELEASE_DIR="${TARGET_DIR}/releases/${SHA}"

            # 1. Verify incoming archive on server
            cd /tmp
            sha256sum -c "release-${SHA}.tar.gz.sha256"

            # 2. Identify currently active release for rollback
            PREVIOUS_RELEASE=""
            if [ -L "${TARGET_DIR}/current" ]; then
              PREVIOUS_RELEASE="$(readlink -f "${TARGET_DIR}/current")"
              echo "Identified current release before deployment: ${PREVIOUS_RELEASE}"
            fi

            # 3. Setup Error Trap for Automatic Rollback
            rollback_handler() {
              EXIT_STATUS=$?
              echo "::error::Remote deployment failed with exit code ${EXIT_STATUS}!"
              if [ -n "${PREVIOUS_RELEASE}" ] && [ -d "${PREVIOUS_RELEASE}" ]; then
                echo "Initiating automated rollback to previous release: ${PREVIOUS_RELEASE}..."
                ln -sfn "${PREVIOUS_RELEASE}" "${TARGET_DIR}/current"
                cd "${PREVIOUS_RELEASE}"
                php artisan config:cache || true
                php artisan route:cache || true
                php artisan view:cache || true
                if [ "${MAINTENANCE}" = "true" ]; then
                  php artisan up || true
                fi
                sudo systemctl reload php8.2-fpm || sudo systemctl reload php-fpm || true
                echo "Automated rollback completed successfully."
              else
                echo "Warning: No previous release symlink found to roll back to."
                if [ -d "${RELEASE_DIR}" ]; then
                  cd "${RELEASE_DIR}"
                  php artisan up || true
                fi
              fi
              rm -f "/tmp/release-${SHA}.tar.gz" "/tmp/release-${SHA}.tar.gz.sha256"
              exit ${EXIT_STATUS}
            }
            trap 'rollback_handler' ERR

            # 4. Prepare release directory
            mkdir -p "${RELEASE_DIR}"
            tar -xzf "/tmp/release-${SHA}.tar.gz" -C "${RELEASE_DIR}"
            rm -f "/tmp/release-${SHA}.tar.gz" "/tmp/release-${SHA}.tar.gz.sha256"

            # 5. Link shared persistent storage and environment
            mkdir -p "${TARGET_DIR}/shared/storage"
            ln -sfn "${TARGET_DIR}/shared/storage" "${RELEASE_DIR}/storage"
            ln -sfn "${TARGET_DIR}/shared/.env" "${RELEASE_DIR}/.env"

            cd "${RELEASE_DIR}"

            # 6. Database backup before migrations
            if [ "${MIGRATIONS}" = "true" ]; then
              echo "Executing automated pre-migration database snapshot..."
              php artisan db:backup --compress
            fi

            # 7. Enable Maintenance Mode (No '|| true')
            if [ "${MAINTENANCE}" = "true" ]; then
              echo "Enabling maintenance mode..."
              php artisan down --message="SMS Academy is temporarily updating. Please refresh in a moment." --retry=60
            fi

            # 8. Execute approved migrations
            if [ "${MIGRATIONS}" = "true" ]; then
              echo "Executing pending database migrations..."
              php artisan migrate --force
            fi

            # 9. Warm up production caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 10. Atomic symlink switch to activate new release
            ln -sfn "${RELEASE_DIR}" "${TARGET_DIR}/current"
            echo "Activated release ${SHA} via atomic symlink."

            # 11. Exit maintenance mode
            if [ "${MAINTENANCE}" = "true" ]; then
              php artisan up
            fi

            # 12. Reload PHP-FPM / OPcache
            sudo systemctl reload php8.2-fpm || sudo systemctl reload php-fpm || true

            # Cancel error trap on success
            trap - ERR
            echo "Remote deployment of release ${SHA} completed successfully."
          REMOTE_SCRIPT

      - name: Post-Deployment Health Check Verification
        run: |
          set -euo pipefail
          HEALTH_URL="${{ vars.APP_URL }}/health"
          echo "Performing post-deployment health check at ${HEALTH_URL}..."

          # Query health endpoint
          HTTP_RESPONSE=$(curl -s -S -w "\n%{http_code}" --max-time 20 "${HEALTH_URL}")
          HTTP_BODY=$(echo "${HTTP_RESPONSE}" | sed '$d')
          HTTP_CODE=$(echo "${HTTP_RESPONSE}" | tail -n 1)

          echo "Response HTTP Code: ${HTTP_CODE}"
          echo "Response Payload: ${HTTP_BODY}"

          if [ "${HTTP_CODE}" -ne 200 ]; then
            echo "::error::Health check failed with HTTP ${HTTP_CODE} at ${HEALTH_URL}."
            exit 1
          fi

          HEALTH_STATUS=$(echo "${HTTP_BODY}" | jq -r '.status // empty' 2>/dev/null || true)
          if [ "${HEALTH_STATUS}" != "healthy" ]; then
            echo "::error::Health check status is '${HEALTH_STATUS}', expected 'healthy'."
            exit 1
          fi

          echo "Post-deployment health check PASSED: System is healthy."
