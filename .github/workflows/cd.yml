name: CD (Deployment)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: 'Execute database migrations'
        required: true
        type: boolean
        default: true
      enable_maintenance:
        description: 'Enable maintenance mode during deployment'
        required: true
        type: boolean
        default: true

concurrency:
  group: cd-${{ inputs.target_env || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read

jobs:
  pre-deploy-validation:
    name: Pre-deployment Gate & Artifact Assembly
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validate Target Commit SHA
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid commit SHA '${SHA}'."
            exit 1
          fi
          echo "Deploying verified commit SHA: ${SHA}"

      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, gd, zip, pdo_mysql, mysqli, gmp, curl
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Verify Mandatory CI Integration Gate Passed for Commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          php .github/scripts/verify-ci-gate.php \
            --repo="${REPO}" \
            --sha="${SHA}" \
            --workflow=ci.yml \
            --gate="CI Integration Gate"

      - name: Validate & Install Production Composer Dependencies
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node.js 14 for Legacy Build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '14'
          cache: npm

      - name: Build Production Assets
        run: |
          set -euo pipefail
          npm ci
          npm run prod

      - name: Verify Asset & Release Manifest Integrity
        run: |
          set -euo pipefail
          test -f public/js/app.js || { echo "::error::public/js/app.js missing"; exit 1; }
          test -f public/css/app.css || { echo "::error::public/css/app.css missing"; exit 1; }
          test -f public/mix-manifest.json || { echo "::error::public/mix-manifest.json missing"; exit 1; }
          test -f database/data/nepal_locations.json || { echo "::error::database/data/nepal_locations.json missing"; exit 1; }
          node -e "const m = require('./public/mix-manifest.json'); if (!m['/js/app.js'] || !m['/css/app.css']) { console.error('Invalid mix-manifest.json'); process.exit(1); }"

      - name: Package Release Archive (Explicit Allowlist Manifest)
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-dist
          printf '%s\n' "${SHA}" > .release_sha
          TAR_FILE="release-dist/release-${SHA}.tar.gz"

          # Explicit production allowlist (excludes .env, tests, logs, node_modules, git metadata)
          tar -czf "${TAR_FILE}" \
            .release_sha \
            app \
            bootstrap \
            config \
            database/data \
            database/migrations \
            database/seeders \
            public \
            resources/views \
            resources/lang \
            routes \
            vendor \
            artisan \
            composer.json \
            composer.lock

          cd release-dist
          sha256sum "release-${SHA}.tar.gz" > "release-${SHA}.tar.gz.sha256"
          cat "release-${SHA}.tar.gz.sha256"
          cd ..
          php .github/scripts/verify-release-archive.php "${TAR_FILE}"
          cp .github/scripts/verify-release-archive.php "release-dist/verify-release-archive.php"

      - name: Upload Release Artifact and Checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            release-dist/release-${{ github.sha }}.tar.gz
            release-dist/release-${{ github.sha }}.tar.gz.sha256
            release-dist/verify-release-archive.php
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to ${{ inputs.target_env || 'staging' }}
    needs: pre-deploy-validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target_env || 'staging' }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Download Release Artifact and Checksum
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-bundle
          path: deploy-dist

      - name: Verify Artifact Checksum
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd deploy-dist
          test -f "release-${SHA}.tar.gz" || { echo "::error::Missing release archive."; exit 1; }
          test -f "release-${SHA}.tar.gz.sha256" || { echo "::error::Missing checksum file."; exit 1; }
          sha256sum -c "release-${SHA}.tar.gz.sha256"
          echo "Release archive cryptographic checksum verified successfully."

      - name: Validate Deployment Credentials, Host Key & Paths
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/sms_academy' }}
          APP_URL: ${{ vars.APP_URL }}
          TARGET_ENV: ${{ inputs.target_env || 'staging' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::error::DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY secrets must be configured in GitHub Environment '${TARGET_ENV}'."
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]; then
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS secret must be configured in '${TARGET_ENV}' to prevent MITM attacks."
            exit 1
          fi
          if [ -z "${APP_URL}" ] || ! [[ "${APP_URL}" =~ ^https?:// ]]; then
            echo "::error::APP_URL environment variable must be a valid http(s):// URL for readiness verification."
            exit 1
          fi
          if ! [[ "${DEPLOY_PORT}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid DEPLOY_PORT '${DEPLOY_PORT}'."
            exit 1
          fi
          if ! [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9/_-]+$ ]] || [ "${DEPLOY_PATH}" = "/" ]; then
            echo "::error::Invalid DEPLOY_PATH '${DEPLOY_PATH}'. Must be a safe non-root absolute path."
            exit 1
          fi

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Execute Atomic Release on Target Host with In-Flight Rollback Trap
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          TARGET_DIR: ${{ vars.DEPLOY_PATH || '/var/www/sms_academy' }}
          KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '5' }}
          APP_URL: ${{ vars.APP_URL }}
          MAINTENANCE: ${{ inputs.enable_maintenance }}
          MIGRATIONS: ${{ inputs.run_migrations }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" -o BatchMode=yes -o ConnectTimeout=15)

          echo "Transferring release ${SHA} to ${DEPLOY_USER}@${DEPLOY_HOST}..."
          scp -P "${DEPLOY_PORT}" "${SSH_OPTS[@]}" \
            "deploy-dist/release-${SHA}.tar.gz" \
            "deploy-dist/release-${SHA}.tar.gz.sha256" \
            "deploy-dist/verify-release-archive.php" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

          ssh -T -p "${DEPLOY_PORT}" "${SSH_OPTS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            TARGET_DIR="${TARGET_DIR}" \
            KEEP_RELEASES="${KEEP_RELEASES}" \
            APP_URL="${APP_URL}" \
            MAINTENANCE="${MAINTENANCE}" \
            MIGRATIONS="${MIGRATIONS}" \
            SHA="${SHA}" \
            HEALTH_MAX_ATTEMPTS="${{ vars.HEALTH_MAX_ATTEMPTS || '6' }}" \
            HEALTH_RETRY_INTERVAL="${{ vars.HEALTH_RETRY_INTERVAL || '5' }}" \
            HEALTH_REQUEST_TIMEOUT="${{ vars.HEALTH_REQUEST_TIMEOUT || '15' }}" \
            bash -s <<'REMOTE_SCRIPT'
            set -euo pipefail

            if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid SHA on remote host."
              exit 1
            fi
            if ! [[ "${TARGET_DIR}" =~ ^/[A-Za-z0-9/_-]+$ ]] || [ "${TARGET_DIR}" = "/" ]; then
              echo "::error::Invalid TARGET_DIR on remote host."
              exit 1
            fi
            if ! [[ "${KEEP_RELEASES}" =~ ^[0-9]+$ ]] || [ "${KEEP_RELEASES}" -lt 1 ]; then
              KEEP_RELEASES=5
            fi

            RELEASE_DIR="${TARGET_DIR}/releases/${SHA}"

            probe_readiness() {
              local url="$1"
              local expected_sha="$2"
              local max_attempts="${HEALTH_MAX_ATTEMPTS:-6}"
              local interval="${HEALTH_RETRY_INTERVAL:-5}"
              local req_timeout="${HEALTH_REQUEST_TIMEOUT:-15}"
              local attempt=1
              while [ "${attempt}" -le "${max_attempts}" ]; do
                local resp body code status rel
                resp=$(curl -s -S -w "\n%{http_code}" --max-time "${req_timeout}" "${url}/health/readiness" || true)
                body=$(printf '%s\n' "${resp}" | sed '$d')
                code=$(printf '%s\n' "${resp}" | tail -n 1)
                status=$(printf '%s\n' "${body}" | grep -o '"status"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | cut -d'"' -f4 || true)
                rel=$(printf '%s\n' "${body}" | grep -o '"release"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | cut -d'"' -f4 || true)

                echo "Readiness probe attempt ${attempt}/${max_attempts}: HTTP=${code}, status=${status}, release=${rel:-none}"
                if [ "${code}" = "200" ] && { [ "${status}" = "ready" ] || [ "${status}" = "healthy" ]; }; then
                  if [ -n "${expected_sha}" ] && [[ "${rel}" =~ ^[0-9a-f]{40}$ ]] && [ "${rel}" = "${expected_sha}" ]; then
                    return 0
                  fi
                  echo "Release mismatch or missing release SHA: expected '${expected_sha}', got '${rel:-missing}'."
                fi
                attempt=$((attempt + 1))
                sleep "${interval}"
              done
              return 1
            }

            # 1. Verify incoming archive checksum & entries on server BEFORE extraction
            cd /tmp
            sha256sum -c "release-${SHA}.tar.gz.sha256"
            php /tmp/verify-release-archive.php "/tmp/release-${SHA}.tar.gz"

            # 2. Identify currently active release for rollback
            PREVIOUS_RELEASE=""
            if [ -L "${TARGET_DIR}/current" ]; then
              PREVIOUS_RELEASE="$(readlink -f "${TARGET_DIR}/current")"
              echo "Active release before deployment: ${PREVIOUS_RELEASE}"
            fi

            # 3. Error trap for automated application rollback (never runs migrate:rollback)
            rollback_handler() {
              EXIT_STATUS=$?
              echo "::error::Remote deployment failed with exit code ${EXIT_STATUS}!"
              local rollback_errors=0
              if [ -n "${PREVIOUS_RELEASE}" ] && [ -d "${PREVIOUS_RELEASE}" ]; then
                echo "Rolling back symlink to previous release: ${PREVIOUS_RELEASE}..."
                ln -sfn "${PREVIOUS_RELEASE}" "${TARGET_DIR}/current"
                cd "${PREVIOUS_RELEASE}"
                php artisan config:cache || rollback_errors=$((rollback_errors + 1))
                php artisan route:cache || rollback_errors=$((rollback_errors + 1))
                php artisan view:cache || rollback_errors=$((rollback_errors + 1))
                if [ "${MAINTENANCE}" = "true" ]; then
                  php artisan up || rollback_errors=$((rollback_errors + 1))
                fi
                if ! (sudo systemctl reload php8.2-fpm || sudo systemctl reload php-fpm); then
                  echo "::error::PHP-FPM reload failed during rollback."
                  rollback_errors=$((rollback_errors + 1))
                fi

                PREV_SHA=""
                if [ -f "${PREVIOUS_RELEASE}/.release_sha" ]; then
                  PREV_SHA=$(cat "${PREVIOUS_RELEASE}/.release_sha" | tr -d '[:space:]')
                fi
                if ! [[ "${PREV_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::Previous release missing valid .release_sha; cannot verify rollback identity."
                  rollback_errors=$((rollback_errors + 1))
                elif ! probe_readiness "${APP_URL}" "${PREV_SHA}"; then
                  echo "::error::CRITICAL: Rollback readiness check FAILED for ${PREVIOUS_RELEASE}!"
                  rollback_errors=$((rollback_errors + 1))
                fi
                echo "Rollback Report: previous=${PREVIOUS_RELEASE}, sha=${PREV_SHA:-missing}, recovery_errors=${rollback_errors}"
                if [ "${rollback_errors}" -gt 0 ]; then
                  echo "::error::CRITICAL: Rollback completed with ${rollback_errors} error(s)."
                else
                  echo "Automated rollback verified healthy for ${PREVIOUS_RELEASE}."
                fi
              else
                echo "::error::No previous release directory found to roll back to."
                if [ -d "${RELEASE_DIR}" ]; then
                  cd "${RELEASE_DIR}"
                  php artisan up || true
                fi
              fi
              rm -f "/tmp/release-${SHA}.tar.gz" "/tmp/release-${SHA}.tar.gz.sha256" "/tmp/verify-release-archive.php"
              exit "${EXIT_STATUS}"
            }
            trap 'rollback_handler' ERR

            # 4. Extract into new release directory
            mkdir -p "${RELEASE_DIR}"
            tar -xzf "/tmp/release-${SHA}.tar.gz" -C "${RELEASE_DIR}"
            rm -f "/tmp/release-${SHA}.tar.gz" "/tmp/release-${SHA}.tar.gz.sha256" "/tmp/verify-release-archive.php"

            # Validate extracted package
            test -f "${RELEASE_DIR}/artisan"
            test -f "${RELEASE_DIR}/vendor/autoload.php"
            test -f "${RELEASE_DIR}/public/mix-manifest.json"
            test -f "${RELEASE_DIR}/.release_sha"

            # 5. Link shared persistent storage and environment
            mkdir -p "${TARGET_DIR}/shared/storage"
            test -f "${TARGET_DIR}/shared/.env"
            ln -sfn "${TARGET_DIR}/shared/storage" "${RELEASE_DIR}/storage"
            ln -sfn "${TARGET_DIR}/shared/.env" "${RELEASE_DIR}/.env"

            cd "${RELEASE_DIR}"
            chmod -R ug+rwX bootstrap/cache || true

            # 6. Pre-migration database backup
            if [ "${MIGRATIONS}" = "true" ]; then
              echo "Executing pre-migration database snapshot..."
              php artisan db:backup --compress
            fi

            # 7. Maintenance mode
            if [ "${MAINTENANCE}" = "true" ]; then
              php artisan down --message="SMS Academy is temporarily updating. Please refresh in a moment." --retry=60
            fi

            # 8. Run pending migrations
            if [ "${MIGRATIONS}" = "true" ]; then
              php artisan migrate --force
            fi

            # 9. Warm production caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 10. Atomic symlink switch
            ln -sfn "${RELEASE_DIR}" "${TARGET_DIR}/current"

            # 11. Reload PHP-FPM safely
            sudo systemctl reload php8.2-fpm || sudo systemctl reload php-fpm || true

            # 12. Exit maintenance mode
            if [ "${MAINTENANCE}" = "true" ]; then
              php artisan up
            fi

            # 13. In-band bounded-retry readiness verification
            if ! probe_readiness "${APP_URL}" "${SHA}"; then
              echo "::error::In-band readiness verification failed for release ${SHA}."
              false
            fi

            # 14. Prune old releases (keep last KEEP_RELEASES, never delete active or rollback release)
            cd "${TARGET_DIR}/releases"
            CURRENT_TARGET="$(readlink -f "${TARGET_DIR}/current" || true)"
            for old_rel in $(ls -1dt */ 2>/dev/null | tail -n +"$((KEEP_RELEASES + 1))"); do
              old_abs="$(readlink -f "${TARGET_DIR}/releases/${old_rel%/}" || true)"
              if [ -n "${old_abs}" ] && [ "${old_abs}" != "${CURRENT_TARGET}" ] && [ "${old_abs}" != "${PREVIOUS_RELEASE}" ]; then
                rm -rf "${old_abs}"
              fi
            done

            trap - ERR
            echo "Deployment of release ${SHA} fully verified and completed."
          REMOTE_SCRIPT

      - name: External Gateway Health Check Verification
        env:
          APP_URL: ${{ vars.APP_URL }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEALTH_URL="${APP_URL}/health/readiness"
          max_attempts=6
          interval=5
          attempt=1

          while [ "${attempt}" -le "${max_attempts}" ]; do
            HTTP_RESPONSE=$(curl -s -S -w "\n%{http_code}" --max-time 15 "${HEALTH_URL}" || true)
            HTTP_BODY=$(printf '%s\n' "${HTTP_RESPONSE}" | sed '$d')
            HTTP_CODE=$(printf '%s\n' "${HTTP_RESPONSE}" | tail -n 1)
            STATUS=$(printf '%s\n' "${HTTP_BODY}" | grep -o '"status"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | cut -d'"' -f4 || true)
            RELEASE=$(printf '%s\n' "${HTTP_BODY}" | grep -o '"release"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 | cut -d'"' -f4 || true)

            echo "External probe ${attempt}/${max_attempts}: HTTP=${HTTP_CODE}, status=${STATUS}, release=${RELEASE:-none}"
            if [ "${HTTP_CODE}" = "200" ] && { [ "${STATUS}" = "ready" ] || [ "${STATUS}" = "healthy" ]; }; then
              if [[ "${RELEASE}" =~ ^[0-9a-f]{40}$ ]] && [ "${RELEASE}" = "${SHA}" ]; then
                echo "External health check PASSED for release ${SHA}."
                exit 0
              fi
              echo "Release mismatch or missing SHA: expected ${SHA}, got ${RELEASE:-missing}."
            fi
            attempt=$((attempt + 1))
            sleep "${interval}"
          done

          echo "::error::External health check failed at ${HEALTH_URL}."
          exit 1
